name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite lanzar la prueba de carga k6 a demanda

# Cancela ejecuciones en curso de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest # trae Docker preinstalado -> Testcontainers (Kafka + Postgres) sin servicios extra
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # El Maven Wrapper se versiona en modo 100644 (no ejecutable); el runner es Linux.
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # Reactor completo: tests unitarios (Surefire) + integracion con Testcontainers (Failsafe) + e2e.
      # Fase 1: instala los artefactos y los 'stubs' jar en el repo local, para que los tests de
      # contrato del lado consumidor (stub-runner en modo LOCAL) resuelvan los stubs del productor.
      - name: Install artifacts and stubs
        run: ./mvnw -B -DskipTests clean install
      # Fase 2: ejecuta toda la suite, incluida la generación y verificación de contratos.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  # Prueba de carga k6: levanta el stack por compose y dispara N transferencias
  # concurrentes sobre la misma cuenta, verificando cero sobregiro.
  # NO corre en cada PR: solo a demanda (workflow_dispatch) o al integrar en main.
  loadtest:
    name: Load test (k6 concurrencia)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5

      # Rate limiting desactivado (override) para no estrangular la rafaga; se aisla la concurrencia.
      - name: Start stack
        run: docker compose -f docker-compose.yml -f loadtest/docker-compose.loadtest.yml up -d --build account-service transfer-service ledger-service

      # Los servicios backend y Keycloak no declaran healthcheck en compose -> se sondea aqui.
      - name: Wait for readiness
        run: |
          wait_for() {
            for i in $(seq 1 60); do
              if curl -sf "$1" >/dev/null 2>&1; then echo "ready: $1"; return 0; fi
              sleep 5
            done
            echo "timeout esperando $1"; return 1
          }
          wait_for http://localhost:8081/actuator/health
          wait_for http://localhost:8082/actuator/health
          wait_for http://localhost:8083/actuator/health
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8180/realms/hexabank/protocol/openid-connect/token \
                 -d grant_type=password -d client_id=hexabank-frontend \
                 -d username=alice -d password=alice >/dev/null 2>&1; then
              echo "keycloak ready"; break
            fi
            sleep 5
          done

      - name: Run k6 concurrent-transfers
        run: docker run --rm --network host -v "$PWD/loadtest:/loadtest" grafana/k6 run /loadtest/concurrent-transfers.js

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200 account-service transfer-service ledger-service

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f loadtest/docker-compose.loadtest.yml down -v
