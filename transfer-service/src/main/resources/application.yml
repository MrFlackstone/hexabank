spring:
  application:
    name: transfer-service
  # Fase 11: virtual threads (Java 21). Cada peticion HTTP se atiende en un hilo virtual -> escala a
  # miles de conexiones concurrentes con memoria minima; el bloqueo en JDBC/Kafka no cuesta un hilo de SO.
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5443/transferdb
    username: hexabank
    password: hexabank
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: transfer-service
  # Valida los Bearer JWT emitidos por Keycloak. issuer-uri = URL interna de la red
  # Docker; en arranque local sin Docker, sobreescribe por env/-D (p. ej. http://localhost:8180/...).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/hexabank

# Resiliencia de la saga (Fase 10). outbox.poll-interval-ms: cadencia del relay que publica los
# eventos pendientes. saga.timeout: antigüedad a partir de la cual una saga no terminal se considera
# atascada; saga.reaper.poll-interval-ms: cadencia del reaper que la recupera.
hexabank:
  outbox:
    poll-interval-ms: 200
  saga:
    timeout: PT30S
    reaper:
      poll-interval-ms: 5000
  # Rate limiting por principal en POST /transfers (Fase 11). enabled=false lo desactiva para el
  # benchmark/carga k6 (aisla el efecto de los virtual threads). STAFF queda exento en el filtro.
  ratelimit:
    enabled: true
    capacity: 50
    refill-tokens: 50
    refill-period: PT1S

server:
  port: 8082

# Observabilidad: Actuator expone los endpoints de gestion; Micrometer publica las metricas en
# formato Prometheus en /actuator/prometheus (modelo pull: Prometheus las raspa cada pocos segundos).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}   # etiqueta comun para filtrar por servicio en Grafana
    distribution:
      percentiles-histogram:
        http.server.requests: true              # habilita histogramas -> latencia/quantiles
  prometheus:
    metrics:
      export:
        enabled: true
