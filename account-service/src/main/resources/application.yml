spring:
  application:
    name: account-service
  # Fase 11: virtual threads (Java 21). Cada peticion HTTP se atiende en un hilo virtual -> escala a
  # miles de conexiones concurrentes con memoria minima; el bloqueo en JDBC/Kafka no cuesta un hilo de SO.
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5442/accountdb
    username: hexabank
    password: hexabank
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: account-service
  # Valida los Bearer JWT emitidos por Keycloak. issuer-uri = URL interna de la red
  # Docker; en arranque local sin Docker, sobreescribe por env/-D (p. ej. http://localhost:8180/...).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/hexabank

# Resiliencia de la saga (Fase 10). Cadencia del relay que publica a Kafka los eventos pendientes
# en la tabla outbox tras el commit.
hexabank:
  outbox:
    poll-interval-ms: 200

server:
  port: 8081

# Observabilidad: Actuator expone los endpoints de gestion; Micrometer publica las metricas en
# formato Prometheus en /actuator/prometheus (modelo pull: Prometheus las raspa cada pocos segundos).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}   # etiqueta comun para filtrar por servicio en Grafana
    distribution:
      percentiles-histogram:
        http.server.requests: true              # habilita histogramas -> latencia/quantiles
  prometheus:
    metrics:
      export:
        enabled: true
  # Tracing distribuido (Fase 12): puente Micrometer -> OpenTelemetry con exportador OTLP.
  # sampling.probability=1.0 traza el 100% de las peticiones (demo). En compose el endpoint se
  # sobreescribe por env MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4318/v1/traces.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
